# Agent identity registry.
#
# Every agent identity that runs a graph in this org gets an entry here BEFORE
# it gets credentials. Rules (validated by scripts/validate.py):
#   - unique id; no shared credentials; agents never impersonate humans
#   - named human owner (a person, not a team alias)
#   - credentials are scoped and just-in-time (kind: jit) — a standing
#     credential fails CI (GE-CRED-STANDING) unless covered by an expiring
#     exception in governance/exceptions.yaml
#   - a working kill switch, and who may pull it
#   - review_by: quarterly recertification date; an active agent past it
#     fails CI (GE-AGENT-RECERT) until owner/scopes/kill switch are
#     re-verified and the date bumped
#   - specs may only reference agents listed here with status: active
#
# Lifecycle: active -> disabled (kill switch pulled; no approval needed)
#                   -> retired (credentials destroyed; kept for audit history)
# Restarting a disabled agent requires approval per governance/decision-rights.md.

agents:
  - id: example-release-bot
    owner: alice
    created: 2026-08-20
    review_by: 2026-11-20
    status: active
    purpose: Runs the weekly-release-review graph for example-team.
    credentials:
      kind: jit
      scope: "repo:example/notes-page write; telemetry read-only"
      issued_via: "CI OIDC exchange, 1h TTL, no standing secrets"
    kill_switch:
      how: "Set status: disabled here; revoke the OIDC trust binding"
      authorized: [security-owner, alice]

  - id: example-triage-bot
    owner: bob
    created: 2026-05-10
    review_by: 2026-11-20
    status: active
    purpose: Runs the dependency-update-triage graph for example-team.
    credentials:
      kind: jit
      scope: "repo:example/acme-app contents+pulls write; telemetry read-only"
      issued_via: "Per-agent GitHub App installation token, 1h TTL"
    kill_switch:
      how: "Set status: disabled here; suspend the App installation"
      authorized: [security-owner, bob]

  - id: example-explainer-bot
    owner: dana
    created: 2026-08-20
    review_by: 2026-11-20
    status: active
    purpose: Runs the ci-failure-explainer graph for example-team (suggest-only).
    credentials:
      kind: jit
      scope: "repo:example/acme-app checks+actions-logs read; issues comment write"
      issued_via: "Per-agent GitHub App installation token, 1h TTL"
    kill_switch:
      how: "Set status: disabled here; suspend the App installation"
      authorized: [security-owner, dana]
