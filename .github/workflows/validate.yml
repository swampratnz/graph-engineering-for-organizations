name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so orphaned specs (past review_by) surface even with no PR traffic.
    - cron: "0 6 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python3 scripts/validate.py
