name: validate

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger: also the keepalive path; GitHub disables scheduled
  # workflows after ~60 days of repo inactivity, and a governance repo in
  # steady state is exactly a low-traffic repo. See docs/platform-hardening.md.
  workflow_dispatch:
  schedule:
    # Weekly, so orphaned specs, lapsed agent recertifications, and expired
    # exceptions surface even with no PR traffic.
    - cron: "0 6 * * 1"

# Least privilege: the validator only reads repo content.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable); Dependabot
      # proposes bumps by PR. Comments track the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/validate.py
