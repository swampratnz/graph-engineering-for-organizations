name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so orphaned specs, lapsed agent recertifications, and expired
    # exceptions surface even with no PR traffic.
    - cron: "0 6 * * 1"

# Least privilege: the validator only reads repo content.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tags are mutable); Dependabot
      # proposes bumps by PR. Comments track the human-readable version.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/validate.py
